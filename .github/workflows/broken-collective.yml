# Rebuilds the Broken Collective book whenever its source changes.
# Edit a chapter in broken-collective-src/content/… on GitHub, commit, and this
# workflow builds the static book and publishes it into /broken-collective/.
name: Broken Collective — build & publish

on:
  push:
    branches: [main]
    paths: ['broken-collective-src/**']
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: broken-collective
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: broken-collective-src/package-lock.json

      - name: Install
        working-directory: broken-collective-src
        run: npm ci --no-audit --no-fund

      - name: Typecheck & build
        working-directory: broken-collective-src
        run: |
          npx tsc --noEmit
          npx next build

      - name: Publish into /broken-collective
        run: |
          rm -rf broken-collective
          cp -r broken-collective-src/out broken-collective
          rm -rf broken-collective/404 broken-collective/404.html broken-collective/_not-found
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add broken-collective
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "Broken Collective: publish rebuilt book"
          git push

      - name: Ask GitHub Pages to redeploy
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${{ github.repository }}/pages/builds"
